services:

  api:
    build: .
    container_name: fde-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fde_demo
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: fde-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fde_demo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fde_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: